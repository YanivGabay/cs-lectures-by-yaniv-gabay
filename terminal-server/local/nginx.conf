# Nginx reverse proxy config for the terminal server
# Place in /etc/nginx/sites-available/terminal and symlink to sites-enabled

server {
    listen 443 ssl http2;
    server_name terminal.cs-lectures.dev;

    ssl_certificate /etc/letsencrypt/live/terminal.cs-lectures.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terminal.cs-lectures.dev/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name terminal.cs-lectures.dev;
    return 301 https://$server_name$request_uri;
}
