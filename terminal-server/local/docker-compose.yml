services:
  terminal-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MAX_SESSIONS=10
      - SESSION_TIMEOUT=300000
      - CONTAINER_IMAGE=cs-lectures-sandbox
      - ALLOWED_ORIGINS=https://cs-lectures.pages.dev,http://localhost:4321,http://localhost:4322
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
